server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 10000
        response-timeout: 60s
        ssl:
          use-insecure-trust-manager: true

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: flight-service
          uri: ${FLIGHT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/flights/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/bookings/**

        - id: passenger-service
          uri: ${PASSENGER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/passengers/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/payments/**

        - id: seat-service
          uri: ${SEAT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/seats/**

        - id: airline-service
          uri: ${AIRLINE_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/airlines/**,/airports/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true